version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postamat_db
    environment:
      POSTGRES_USER: postamat_user
      POSTGRES_PASSWORD: postamat_pass
      POSTGRES_DB: postamat-project
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postamat_user -d postamat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: postamat_app
    ports:
      - "8001:8001"
    environment:
      - DJANGO_SETTINGS_MODULE=postamat_project.settings
      - DB_NAME=postamat-project
      - DB_USER=postamat_user
      - DB_PASSWORD=postamat_pass
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
