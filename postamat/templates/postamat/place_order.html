{% extends "postamat/base.html" %}

{% block content %}
<h2>Place an order</h2>
<form method="post" action="{% url 'postamat:place_order_ui' postamat_id=postamat_id %}">
    {% csrf_token %}
    <div class="form-group">
        <label for="order_id">Order id:</label>
        <input type="text" id="order_id" name="order_id" required>
    </div>
    <div class="form-group">
        <label for="user_phone">User phone:</label>
        <input type="text" id="user_phone" name="user_phone" placeholder="375xxxxxxxxx" required>
    </div>
    <button type="submit">Place</button>
</form>

<p><a href="{% url 'postamat:index' %}">To main</a></p>
{% endblock %}
