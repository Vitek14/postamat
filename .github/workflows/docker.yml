name: Build and Push Docker Image

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # for caching support(below) and other features in future(like building for arm)

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'   # for security(like said google, bad guy can make fork and steal creds)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            yourusername/yourapp:latest
            yourusername/yourapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
